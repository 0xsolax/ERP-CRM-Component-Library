notes:
  - 按 SOL-50 要求保持 draft；未补齐目标项目 DDL、状态机、权限和运行验收前不得标记可直接复用。
  - zhongsheng-AI 只提供 supplier 基础 CRUD；qmy-java/qmy-admin 提供采购复杂流参考证据。
  - 报价阶段不强绑定供应商，采购阶段按供应商聚合采购单，是本组件的关键业务边界。
  - order-management 与 product-material 是复杂采购流建议依赖，不作为简版供应商 CRUD 的必选前置。
  - 入库、库存、财务付款和供应商对账仍需 warehouse-delivery 与 finance 组件承接。
