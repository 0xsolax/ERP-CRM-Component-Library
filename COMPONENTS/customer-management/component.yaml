notes:
  - 组件当前为 reference，适合作为客户管理方案参考。
  - qmy-java 是 SOL-47 的补充来源，用于补齐 qmy-admin 前端接口对应的后端事实。
  - legacy zhongsheng-AI 后端存在 Customer.owner/follower 与 init.sql 不一致，正式接入前必须修正。
  - 客户导入、平台同步和爬虫不是默认能力。
