spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  application:
    name: project-application

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    context-path: /api

auth:
  jwt:
    issuer: project-scaffold
    secret: ${AUTH_JWT_SECRET:}
    access-token-expire-seconds: ${AUTH_JWT_ACCESS_TOKEN_EXPIRE_SECONDS:7200}
    header-name: ${AUTH_JWT_HEADER_NAME:qiaomoyun-token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
