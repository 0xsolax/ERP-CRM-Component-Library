notes:
  - 按 SOL-51 要求保持 draft；未确认库存扣减、库存占用释放、状态机和正式 DDL 前不得标记为可直接复用。
  - qmy-java 已提供仓储发货 controller/manager/entity/mapper/event 证据，但缺少可直接迁移的建表 SQL。
  - qmy-admin 的 admin delivery 路由文件整体注释，属于 legacy/停用入口；默认接入应以 warehouse 路由为主。
  - 物流面单、运费导入、收付款和订单履约属于跨组件边界，接入时必须联动 order-management、purchase-supplier 和 finance。
