notes:
  - 组件当前为 reference，适合作为报价链路和复杂报价流方案参考。
  - zhongsheng-AI 仅覆盖 PRD 基础 CRUD；qmy-java/qmy-admin 覆盖 SED 复杂报价流。
  - qmy-java 未提供完整建表 SQL，数据契约依据实体、Mapper XML 和前端字段整理。
  - 复杂流强依赖产品物料、客户管理、基础数据、文件和订单组件，不能作为独立 SDK 使用。
